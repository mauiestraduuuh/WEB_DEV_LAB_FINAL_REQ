<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dior Perfume</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo">DIOR</div>
        <nav class="nav">
            <a href="#" class="nav-link">Home</a>
            <a href="#" class="nav-link">Shop</a>
            <a href="#" class="nav-link">About</a>
            <a href="#" class="nav-link">Contact</a>
        </nav>
    </header>

    <main class="product-page">
        <section class="product-gallery">
            <img id="mainImage" src="image1.jpg" alt="Dior Perfume" class="main-image">
            <div class="thumbnail-gallery">
                <img src="image1.jpg" alt="Thumbnail 1" class="thumbnail" onclick="changeImage('image1.jpg')">
                <img src="image2.jpg" alt="Thumbnail 2" class="thumbnail" onclick="changeImage('image2.jpg')">
                <img src="image3.jpg" alt="Thumbnail 3" class="thumbnail" onclick="changeImage('image3.jpg')">
            </div>
        </section>

        <section class="product-details">
            <h1>Dior Sauvage Eau de Parfum</h1>
            <p class="description">Discover the iconic Dior Sauvage Eau de Parfum, a bold fragrance with notes of bergamot, vanilla, and ambergris. An emblem of sophistication and elegance.</p>
            <p class="price">Price: <span id="price">$120.00</span></p>

            <div class="quantity-section">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" min="1" value="1" onchange="updatePrice()">
            </div>

            <p>Total Price: <span id="totalPrice">$120.00</span></p>

            <button class="add-to-cart">Add to Cart</button>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Dior. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
